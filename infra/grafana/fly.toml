app = "scorearc-observability"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

# Only the Vercel bearer-authenticated collector is reachable through Fly Proxy.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "operations_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

[[restart]]
  policy = "always"
