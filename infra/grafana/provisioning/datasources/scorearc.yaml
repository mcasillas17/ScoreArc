apiVersion: 1
datasources:
  - name: ScoreArc logs
    uid: scorearc-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
  - name: ScoreArc ingester
    uid: scorearc-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: $PGHOST
    user: $PGUSER
    secureJsonData:
      password: $PGPASSWORD
    jsonData:
      database: $PGDATABASE
      sslmode: $PGSSLMODE
      postgresVersion: 1600
      maxOpenConns: 3
      maxIdleConns: 1
      connMaxLifetime: 300
    editable: false
