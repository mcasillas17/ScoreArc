secret:
  shipper: {type: file, path: /etc/vector/shipper-credentials.json}
sources:
  reader:
    type: nats
    url: "nats://[fdaa::3]:4223"
    subject: "logs.scorearc-reader.>"
    connection_name: scorearc-grafana-reader
    queue: scorearc-grafana
    auth: &auth
      strategy: user_password
      user_password:
        user: "SECRET[shipper.org]"
        password: "SECRET[shipper.fly]"
  ingester:
    type: nats
    url: "nats://[fdaa::3]:4223"
    subject: "logs.scorearc-ingester.>"
    connection_name: scorearc-grafana-ingester
    queue: scorearc-grafana
    auth: *auth
transforms:
  application_health:
    type: remap
    inputs: [reader, ingester]
    drop_on_abort: true
    drop_on_error: true
    source: |
      envelope = object!(parse_json!(string!(.message)))
      app = string!(envelope.fly.app.name)
      row = object!(parse_json!(string!(envelope.message)))
      if !includes(["scorearc-reader", "scorearc-ingester"], app) { abort }
      if row.event != "scorearc_http" {
        if app != "scorearc-reader" || row.msg != "request" || exists(row.event) { abort }
        # In the normal access log, unmatched routes can contain the raw path.
        route = string!(row.route)
        known = ["/healthz", "/v1/matches/{id}", "/v1/matches/{id}/box-score", "/v1/competitions/{comp}/news",
          "/v1/competitions/{comp}/{season}/matches", "/v1/competitions/{comp}/{season}/identities",
          "/v1/competitions/{comp}/{season}/calendar", "/v1/competitions/{comp}/{season}/standings",
          "/v1/competitions/{comp}/{season}/bracket", "/v1/competitions/{comp}/{season}/top-scorers",
          "/v1/competitions/{comp}/{season}/leaders", "/v1/competitions/{comp}/{season}/teams",
          "/v1/competitions/{comp}/{season}/teams/{teamId}", "/v1/competitions/{comp}/{season}/teams/{teamId}/squad",
          "/v1/competitions/{comp}/{season}/players/{playerId}"]
        if !includes(known, route) { route = "unmatched" }
        method = if includes(["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS", "TRACE", "CONNECT"], row.method) { row.method } else { "other" }
        status = int!(row.status)
        if status < 100 || status > 599 || !is_integer(row.duration_ms) { abort }
        outcome = if status >= 400 { "http_error" } else { "success" }
        row = {"event": "scorearc_http", "service": "reader", "direction": "inbound", "dependency": "self",
          "endpoint": route, "method": method, "status": status, "outcome": outcome,
          "time": row.time, "durationMs": row.duration_ms, "bytes": row.bytes}
      }
      . = {"fly": {"app": {"name": app}}, "message": encode_json(row)}
sinks:
  collector:
    type: http
    inputs: [application_health]
    uri: "https://telemetry.scorearc.futbol/fly"
    encoding: {codec: json}
    auth:
      strategy: bearer
      token: "SECRET[shipper.receiver]"
    healthcheck: {enabled: false}
