<!doctype html>
<!--
  Source for public/brand/og.png — the card WhatsApp, Twitter and Slack show.

  Kept because the delivered scorearc-og-3a.png had its tagline clipped mid-word
  at the right edge of the canvas ("...standings, every a"), which is invisible
  until someone shares a link. Regenerating from this file is one command:

    open this at exactly 1200x630 in a headless browser and screenshot it.

  Change the tagline HERE, not in an image editor, so the card and the site can
  never disagree about what ScoreArc says it is.
--><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;background:#0a0d0c;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:34px;
       font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
  .tag{color:#9aa3a0;font-size:32px;font-weight:500;letter-spacing:-.2px;
       max-width:900px;text-align:center;line-height:1.35}
</style></head><body>
  <img src="/brand/scorearc-lockup-3a-dark.svg" style="width:620px;display:block">
  <div class="tag">Live football — brackets, scores &amp; standings, every arc.</div>
</body></html>
