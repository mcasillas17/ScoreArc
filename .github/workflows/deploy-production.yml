name: Production release

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      selection:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  release:
    if: >-
      github.repository == 'mcasillas17/ScoreArc' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production-${{ inputs.service }}
      deployment: false
    concurrency:
      group: deploy-${{ inputs.service }}
      cancel-in-progress: false
      queue: max
    env:
      RELEASE_SERVICE: ${{ inputs.service }}
      RELEASE_SELECTION: ${{ inputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
      - name: Exact-SHA eligibility and cumulative path filter
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-release.mjs prepare
      - name: Require deployment credentials
        if: steps.plan.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ inputs.service == 'reader' && secrets.FLY_API_TOKEN_READER || inputs.service == 'ingester' && secrets.FLY_API_TOKEN_INGESTER || '' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ "$RELEASE_SERVICE" = frontend ]; then
            test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" || {
              echo "::error::Missing Vercel credentials/IDs; no deployment occurred"; exit 1;
            }
          else
            test -n "$FLY_API_TOKEN" || {
              echo "::error::Missing app-scoped Fly token; no deployment occurred"; exit 1;
            }
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: steps.plan.outputs.deploy == 'true' && inputs.service != 'frontend'
        with:
          version: 0.4.83
      - name: Install pinned Vercel CLI
        if: steps.plan.outputs.deploy == 'true' && inputs.service == 'frontend'
        run: npm install --global vercel@59.11.7
      - name: Revalidate and start release ledger
        id: begin
        if: steps.plan.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: node scripts/production-release.mjs begin
      - name: Revalidate before provider operation
        id: precheck
        if: steps.plan.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: node scripts/production-release.mjs assert
      - name: Publish tested Fly commit
        id: fly
        if: steps.precheck.outputs.current == 'true' && inputs.service != 'frontend'
        env:
          FLY_API_TOKEN: ${{ inputs.service == 'reader' && secrets.FLY_API_TOKEN_READER || inputs.service == 'ingester' && secrets.FLY_API_TOKEN_INGESTER || '' }}
        run: |
          case "$RELEASE_SERVICE" in
            reader)
              flyctl deploy backend --config reader/fly.toml --dockerfile reader/Dockerfile --remote-only
              ;;
            ingester)
              flyctl deploy backend --config ingester/fly.toml --dockerfile ingester/Dockerfile --remote-only --ha=false
              ;;
            *) echo "::error::Unknown release service"; exit 1 ;;
          esac
      - name: Stage tested frontend without production domains
        id: stage
        if: steps.precheck.outputs.current == 'true' && inputs.service == 'frontend'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --yes --prod --skip-domain --token "$VERCEL_TOKEN" \
            --meta "scorearcCommitSha=$GITHUB_SHA" \
            --meta "scorearcRunId=$GITHUB_RUN_ID" \
            --meta "scorearcRunAttempt=$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/production-url.txt"
      - name: Revalidate before production promotion
        id: promote_gate
        if: steps.stage.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: node scripts/production-release.mjs assert
      - name: Promote and confirm tested frontend
        id: promote
        if: steps.promote_gate.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          vercel promote "$(cat "$RUNNER_TEMP/production-url.txt")" --yes --timeout 10m --token "$VERCEL_TOKEN"
          node scripts/production-release.mjs confirm-vercel
      - name: Record actual release outcome
        if: always() && steps.begin.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.begin.outputs.id }}
          FLY_OUTCOME: ${{ steps.fly.outcome }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          PRECHECK_CURRENT: ${{ steps.precheck.outputs.current }}
          PROMOTE_CURRENT: ${{ steps.promote_gate.outputs.current }}
        run: node scripts/production-release.mjs finish
