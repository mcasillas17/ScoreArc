name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "After full CI: release changed services, or explicitly redeploy"
        type: choice
        default: changed
        options: [changed, reader, ingester, frontend, all]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scorearc
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scorearc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_DSN: postgres://postgres:postgres@localhost:5432/scorearc?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # jsdom 30 requires Node >=22.22.2; keep CI at or above that floor.
          node-version: 22.23.2
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - run: npm run export:competitions
      - name: Verify generated competition registry
        run: git diff --exit-code -- backend/config/competitions.json
      - run: npm run export:teams
      - name: Verify generated team crosswalk
        run: git diff --exit-code -- src/server/data/teamCrosswalk.json
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Apply database migrations
        run: for migration in backend/migrations/*.up.sql; do psql "$DIRECT_DSN" -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Test Go backend
        working-directory: backend
        run: go test -race ./...
      - name: Vet Go backend
        working-directory: backend
        run: go vet ./...
      - name: Verify database migration rollback
        run: for migration in $(find backend/migrations -name '*.down.sql' | sort -r); do psql "$DIRECT_DSN" -v ON_ERROR_STOP=1 -f "$migration"; done

  # PR-time signal: both Fly services require exactly the highest migration, and
  # their release_command refuses an older production schema, so merging before
  # the production apply produces a refused (inactive) release, not a deploy.
  migration-notice:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Warn when this PR raises the schema head
        run: |
          # The checkout is the PR merge commit; HEAD^1 is the base it merges into.
          added=$(git diff --name-only --no-renames --diff-filter=A HEAD^1 HEAD -- 'backend/migrations/*.up.sql')
          [ -n "$added" ] || exit 0
          head=$(cd backend/migrations && ls -- *.up.sql | sort -n | tail -n 1)
          head=${head%.up.sql}
          {
            echo "### Schema head \`$head\`: apply this migration to production before merging"
            echo
            printf '%s\n' "$added" | sed 's/.*/- `&`/'
            echo
            echo "Apply it with authorization and read it back as each service login, then merge: the release's"
            echo "\`-check-schema\` release_command refuses an older production schema without changing any service machine."
            echo "See docs/backend/RELEASES.md#release-time-schema-gate."
          } >> "$GITHUB_STEP_SUMMARY"
          # git quotes paths with newlines, so each name stays on its own command line.
          printf '%s\n' "$added" | while IFS= read -r file; do
            echo "::warning file=$file,line=1,title=Schema migration::New schema head $head: apply this migration to production before merging."
          done

  production:
    needs: test
    if: >-
      needs.test.result == 'success' &&
      github.repository == 'mcasillas17/ScoreArc' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: read
      deployments: write
    strategy:
      fail-fast: false
      matrix:
        service: [reader, ingester, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production-${{ matrix.service }}
      deployment: false
    concurrency:
      group: deploy-${{ matrix.service }}
      cancel-in-progress: false
      queue: max
    env:
      RELEASE_SERVICE: ${{ matrix.service }}
      RELEASE_SELECTION: ${{ inputs.release || 'changed' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
      - name: Exact-SHA eligibility and cumulative path filter
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-release.mjs prepare
      - name: Require deployment credentials
        if: steps.plan.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ matrix.service == 'reader' && secrets.FLY_API_TOKEN_READER || matrix.service == 'ingester' && secrets.FLY_API_TOKEN_INGESTER || '' }}
          VERCEL_TOKEN: ${{ matrix.service == 'frontend' && secrets.VERCEL_TOKEN || '' }}
          VERCEL_ORG_ID: ${{ matrix.service == 'frontend' && vars.VERCEL_ORG_ID || '' }}
          VERCEL_PROJECT_ID: ${{ matrix.service == 'frontend' && vars.VERCEL_PROJECT_ID || '' }}
        run: |
          if [ "$RELEASE_SERVICE" = frontend ]; then
            test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" || {
              echo "::error::Missing Vercel credentials/IDs; no deployment occurred"; exit 1;
            }
          else
            test -n "$FLY_API_TOKEN" || {
              echo "::error::Missing app-scoped Fly token; no deployment occurred"; exit 1;
            }
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: steps.plan.outputs.deploy == 'true' && matrix.service != 'frontend'
        with:
          version: 0.4.83
      - name: Install pinned Vercel CLI
        if: steps.plan.outputs.deploy == 'true' && matrix.service == 'frontend'
        run: npm install --global vercel@59.11.7
      - name: Revalidate and start release ledger
        id: begin
        if: steps.plan.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ matrix.service == 'frontend' && secrets.VERCEL_TOKEN || '' }}
          VERCEL_ORG_ID: ${{ matrix.service == 'frontend' && vars.VERCEL_ORG_ID || '' }}
          VERCEL_PROJECT_ID: ${{ matrix.service == 'frontend' && vars.VERCEL_PROJECT_ID || '' }}
        run: node scripts/production-release.mjs begin
      - name: Revalidate before provider operation
        id: precheck
        if: steps.plan.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ matrix.service == 'frontend' && secrets.VERCEL_TOKEN || '' }}
          VERCEL_ORG_ID: ${{ matrix.service == 'frontend' && vars.VERCEL_ORG_ID || '' }}
          VERCEL_PROJECT_ID: ${{ matrix.service == 'frontend' && vars.VERCEL_PROJECT_ID || '' }}
        run: node scripts/production-release.mjs assert
      - name: Publish tested Fly commit
        id: fly
        if: steps.precheck.outputs.current == 'true' && matrix.service != 'frontend'
        env:
          FLY_API_TOKEN: ${{ matrix.service == 'reader' && secrets.FLY_API_TOKEN_READER || matrix.service == 'ingester' && secrets.FLY_API_TOKEN_INGESTER || '' }}
        run: |
          # flyctl's own exit status and output decide whether the ledger may
          # record that release_command stopped the deploy before any service machine changed.
          set -o pipefail
          publish() {
            flyctl deploy backend "$@" 2>&1 | tee "$RUNNER_TEMP/flyctl-deploy.log" && return 0
            status=$?
            node scripts/production-release.mjs record-fly-failure "$status"
            return "$status"
          }
          case "$RELEASE_SERVICE" in
            reader)
              publish --config reader/fly.toml --dockerfile reader/Dockerfile --remote-only
              ;;
            ingester)
              publish --config ingester/fly.toml --dockerfile ingester/Dockerfile --remote-only --ha=false
              node scripts/production-release.mjs verify-ingester
              ;;
            *) echo "::error::Unknown release service"; exit 1 ;;
          esac
      - name: Stage tested frontend without production domains
        id: stage
        if: steps.precheck.outputs.current == 'true' && matrix.service == 'frontend'
        env:
          VERCEL_TOKEN: ${{ matrix.service == 'frontend' && secrets.VERCEL_TOKEN || '' }}
          VERCEL_ORG_ID: ${{ matrix.service == 'frontend' && vars.VERCEL_ORG_ID || '' }}
          VERCEL_PROJECT_ID: ${{ matrix.service == 'frontend' && vars.VERCEL_PROJECT_ID || '' }}
        run: |
          vercel deploy --yes --prod --skip-domain \
            --meta "scorearcCommitSha=$GITHUB_SHA" \
            --meta "scorearcRunId=$GITHUB_RUN_ID" \
            --meta "scorearcRunAttempt=$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/production-url.txt"
      - name: Revalidate before production promotion
        id: promote_gate
        if: steps.stage.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ matrix.service == 'frontend' && secrets.VERCEL_TOKEN || '' }}
          VERCEL_ORG_ID: ${{ matrix.service == 'frontend' && vars.VERCEL_ORG_ID || '' }}
          VERCEL_PROJECT_ID: ${{ matrix.service == 'frontend' && vars.VERCEL_PROJECT_ID || '' }}
        run: node scripts/production-release.mjs assert
      - name: Promote and confirm tested frontend
        id: promote
        if: steps.promote_gate.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ matrix.service == 'frontend' && secrets.VERCEL_TOKEN || '' }}
          VERCEL_ORG_ID: ${{ matrix.service == 'frontend' && vars.VERCEL_ORG_ID || '' }}
          VERCEL_PROJECT_ID: ${{ matrix.service == 'frontend' && vars.VERCEL_PROJECT_ID || '' }}
        run: node scripts/production-release.mjs promote-vercel
      - name: Record actual release outcome
        if: always() && steps.begin.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.begin.outputs.id }}
          FLY_OUTCOME: ${{ steps.fly.outcome }}
          FLY_ABORTED_BEFORE_MACHINES: ${{ steps.fly.outputs.aborted_before_machines }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          PRECHECK_CURRENT: ${{ steps.precheck.outputs.current }}
          PROMOTE_CURRENT: ${{ steps.promote_gate.outputs.current }}
        run: node scripts/production-release.mjs finish
