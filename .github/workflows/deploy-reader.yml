name: Deploy reader

on:
  push:
    branches: [main]
    paths:
      - "backend/reader/**"
      - "backend/shared/**"
      - "backend/config/**"
      - "backend/go.mod"
      - "backend/go.sum"
      - ".github/workflows/deploy-reader.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-reader
  cancel-in-progress: false

jobs:
  deploy:
    name: flyctl deploy (reader)
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless Fly credentials exist
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_READER }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN is not set - Fly is not provisioned yet. Skipping deploy."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.guard.outputs.enabled == 'true'
      - name: Deploy reader to Fly
        if: steps.guard.outputs.enabled == 'true'
        run: >-
          flyctl deploy backend
          --config reader/fly.toml
          --dockerfile reader/Dockerfile
          --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_READER }}
