name: Match freshness reader check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions expression comparisons ignore case. Check the exact ref before checkout.
      - name: Require refs/heads/main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Observe monitored seasons
        env:
          SCOREARC_READER_API_KEY: ${{ secrets.SCOREARC_READER_API_KEY }}
        run: |
          node -e '
            const key = process.env.SCOREARC_READER_API_KEY;
            if (!key || key.length < 32 || /\s/.test(key)) {
              console.error("SCOREARC_READER_API_KEY is missing or malformed; no seasons were read.");
              process.exit(1);
            }
          '
          node scripts/fly-match-freshness.mjs observe
