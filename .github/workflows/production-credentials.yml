name: Production credential preflight (no deployment)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Check environment access using the production job topology; does not deploy"
        required: true
        type: choice
        default: reader
        options: [reader, ingester, frontend]

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.repository == 'mcasillas17/ScoreArc' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == 'mcasillas17/ScoreArc/.github/workflows/production-credentials.yml@refs/heads/main' &&
      contains(fromJSON('["reader","ingester","frontend"]'), inputs.service)
    strategy:
      fail-fast: false
      matrix:
        service: ["${{ inputs.service }}"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production-${{ matrix.service }}
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
      - name: Report presence booleans only
        env:
          PREFLIGHT_SERVICE: ${{ matrix.service }}
          PREFLIGHT_ENVIRONMENT: production-${{ matrix.service }}
          TOKEN_PRESENT: ${{ (matrix.service == 'reader' && secrets.FLY_API_TOKEN_READER || matrix.service == 'ingester' && secrets.FLY_API_TOKEN_INGESTER || matrix.service == 'frontend' && secrets.VERCEL_TOKEN || '') != '' }}
          # Optional known-nonempty control: only in this production environment,
          # never at repo/org scope. Without it, two absent signals are inconclusive.
          CONTROL_PRESENT: ${{ secrets.CREDENTIAL_PREFLIGHT_CONTROL != '' }}
          ORG_ID_PRESENT: ${{ matrix.service == 'frontend' && vars.VERCEL_ORG_ID != '' }}
          PROJECT_ID_PRESENT: ${{ matrix.service == 'frontend' && vars.VERCEL_PROJECT_ID != '' }}
        run: node scripts/production-credentials.mjs
