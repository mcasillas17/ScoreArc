name: Match freshness watchdog

# In github mode the alert receiver dispatches this workflow on main every
# five minutes. During a handoff the operator controls the single restore run.
on:
  workflow_dispatch:
    inputs:
      initialize_state:
        description: First history only; fails if any previous checkpoint or uncertain history exists
        type: boolean
        default: false
        required: false
      restore_from_fly:
        description: Restore the parked Fly checkpoint from the receiver during rollback
        type: boolean
        default: false
        required: false
      recovery_run_id:
        description: Owner-reviewed recovery only; exact prior run holding the final checkpoint
        type: string
        default: ""
        required: false
      recovery_artifact_id:
        description: Owner-reviewed recovery only; exact match-freshness-state artifact
        type: string
        default: ""
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: match-freshness-watchdog
  cancel-in-progress: false

jobs:
  check:
    if: ${{ vars.MATCH_FRESHNESS_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MATCH_FRESHNESS_ENABLED: ${{ vars.MATCH_FRESHNESS_ENABLED }}
      MATCH_FRESHNESS_DELIVERY_ENABLED: ${{ vars.MATCH_FRESHNESS_DELIVERY_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Select newest trusted checkpoint, including failed runs
        id: select
        if: ${{ !inputs.restore_from_fly }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INITIALIZE_STATE: ${{ inputs.initialize_state || false }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id || '' }}
          RECOVERY_ARTIFACT_ID: ${{ inputs.recovery_artifact_id || '' }}
        run: node scripts/match-freshness-monitor.mjs select
      - name: Restore selected checkpoint
        id: restore
        if: steps.select.outputs.initialize == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          path: watchdog-state
          merge-multiple: true
          run-id: ${{ steps.select.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Fetch drained Fly checkpoint
        id: fly
        if: ${{ inputs.restore_from_fly }}
        env:
          RESTORE_FROM_FLY: ${{ inputs.restore_from_fly }}
          INITIALIZE_STATE: ${{ inputs.initialize_state || false }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id || '' }}
          RECOVERY_ARTIFACT_ID: ${{ inputs.recovery_artifact_id || '' }}
          MATCH_FRESHNESS_WEBHOOK_URL: ${{ secrets.MATCH_FRESHNESS_WEBHOOK_URL }}
          MATCH_FRESHNESS_WEBHOOK_TOKEN: ${{ secrets.MATCH_FRESHNESS_WEBHOOK_TOKEN }}
        run: node scripts/match-freshness-monitor.mjs restore-fly
      - name: Prepare pending state
        id: prepare
        # Select records a decision only when the CLI is enabled (exact 'true'). Without one
        # (e.g. 'TRUE' passed the case-insensitive job gate) Prepare is skipped, which the
        # selector passes over, instead of succeeding without a checkpoint (a barrier).
        if: ${{ success() && (steps.fly.outputs.fetched == 'true' || steps.select.outputs.initialize == 'true' || steps.select.outputs.initialize == 'false') }}
        env:
          RESTORE_FROM_FLY: ${{ inputs.restore_from_fly || false }}
          SCOREARC_READER_API_KEY: ${{ secrets.SCOREARC_READER_API_KEY }}
        run: node scripts/match-freshness-monitor.mjs prepare
      - name: Commit pending checkpoint before any send
        id: pending
        if: ${{ success() && steps.prepare.outputs.state_written == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: match-freshness-pending
          path: watchdog-state/state.json
          if-no-files-found: error
          retention-days: 90
      - name: Deliver reserved transitions
        id: deliver
        if: ${{ success() && steps.pending.outcome == 'success' && vars.MATCH_FRESHNESS_DELIVERY_ENABLED == 'true' }}
        env:
          PENDING_ARTIFACT_ID: ${{ steps.pending.outputs.artifact-id }}
          MATCH_FRESHNESS_WEBHOOK_URL: ${{ secrets.MATCH_FRESHNESS_WEBHOOK_URL }}
          MATCH_FRESHNESS_WEBHOOK_TOKEN: ${{ secrets.MATCH_FRESHNESS_WEBHOOK_TOKEN }}
        run: node scripts/match-freshness-monitor.mjs deliver
      - name: Commit acknowledged checkpoint
        id: final
        if: ${{ always() && steps.deliver.outputs.state_written == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: match-freshness-state
          path: watchdog-state/state.json
          if-no-files-found: error
          retention-days: 90
      - name: Report data and monitor status separately
        id: result
        if: ${{ always() && !inputs.restore_from_fly && steps.prepare.outputs.state_written == 'true' }}
        env:
          # Runs send a heartbeat to the receiver's not-running check, only after both
          # checkpoints were uploaded.
          MATCH_FRESHNESS_WEBHOOK_URL: ${{ secrets.MATCH_FRESHNESS_WEBHOOK_URL }}
          MATCH_FRESHNESS_WEBHOOK_TOKEN: ${{ secrets.MATCH_FRESHNESS_WEBHOOK_TOKEN }}
          CHECKPOINT_COMMITTED: ${{ steps.pending.outcome == 'success' && steps.final.outcome == 'success' }}
        run: node scripts/match-freshness-monitor.mjs result
