name: Match freshness watchdog

# Activation is NOT part of this change. After owner approval, add this trigger:
# schedule:
#   - cron: '3-58/5 * * * *'
# Keep MATCH_FRESHNESS_ENABLED unset/false until bootstrap and channel acceptance.
on:
  workflow_dispatch:
    inputs:
      initialize_state:
        description: First history only; fails if any previous checkpoint or uncertain history exists
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: match-freshness-watchdog
  cancel-in-progress: false

jobs:
  check:
    if: ${{ vars.MATCH_FRESHNESS_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MATCH_FRESHNESS_ENABLED: ${{ vars.MATCH_FRESHNESS_ENABLED }}
      MATCH_FRESHNESS_DELIVERY_ENABLED: ${{ vars.MATCH_FRESHNESS_DELIVERY_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
      - name: Select newest trusted checkpoint, including failed runs
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INITIALIZE_STATE: ${{ inputs.initialize_state || false }}
        run: node scripts/match-freshness-monitor.mjs select
      - name: Restore selected checkpoint
        id: restore
        if: steps.select.outputs.initialize == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          path: watchdog-state
          merge-multiple: true
          run-id: ${{ steps.select.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare pending state
        id: prepare
        run: node scripts/match-freshness-monitor.mjs prepare
      - name: Commit pending checkpoint before any send
        id: pending
        if: ${{ success() && steps.prepare.outputs.state_written == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: match-freshness-pending
          path: watchdog-state/state.json
          if-no-files-found: error
          retention-days: 90
      - name: Deliver reserved transitions
        id: deliver
        if: ${{ success() && steps.pending.outcome == 'success' && vars.MATCH_FRESHNESS_DELIVERY_ENABLED == 'true' }}
        env:
          PENDING_ARTIFACT_ID: ${{ steps.pending.outputs.artifact-id }}
          MATCH_FRESHNESS_WEBHOOK_URL: ${{ secrets.MATCH_FRESHNESS_WEBHOOK_URL }}
        run: node scripts/match-freshness-monitor.mjs deliver
      - name: Commit acknowledged checkpoint
        id: final
        if: ${{ always() && steps.deliver.outputs.state_written == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: match-freshness-state
          path: watchdog-state/state.json
          if-no-files-found: error
          retention-days: 90
      - name: Report data and monitor status separately
        id: result
        if: ${{ always() && steps.prepare.outputs.state_written == 'true' }}
        run: node scripts/match-freshness-monitor.mjs result
