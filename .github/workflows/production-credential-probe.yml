name: Reusable credential probe (no deployment)

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.repository == 'mcasillas17/ScoreArc' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == 'mcasillas17/ScoreArc/.github/workflows/production-credentials.yml@refs/heads/main' &&
      contains(fromJSON('["reader","ingester","frontend"]'), inputs.service)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production-${{ inputs.service }}
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
      - name: Report presence booleans only
        env:
          PREFLIGHT_SERVICE: ${{ inputs.service }}
          PREFLIGHT_ENVIRONMENT: production-${{ inputs.service }}
          TOKEN_PRESENT: ${{ (inputs.service == 'reader' && secrets.FLY_API_TOKEN_READER || inputs.service == 'ingester' && secrets.FLY_API_TOKEN_INGESTER || inputs.service == 'frontend' && secrets.VERCEL_TOKEN || '') != '' }}
          # Optional known-nonempty control: only in this production environment,
          # never at repo/org scope. Without it, two absent signals are inconclusive.
          CONTROL_PRESENT: ${{ secrets.CREDENTIAL_PREFLIGHT_CONTROL != '' }}
          ORG_ID_PRESENT: ${{ vars.VERCEL_ORG_ID != '' }}
          PROJECT_ID_PRESENT: ${{ vars.VERCEL_PROJECT_ID != '' }}
        run: node scripts/production-credentials.mjs
