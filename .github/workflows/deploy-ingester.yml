name: Deploy ingester

on:
  push:
    branches: [main]
    paths:
      - "backend/ingester/**"
      - "backend/shared/**"
      - "backend/config/**"
      - "backend/go.mod"
      - "backend/go.sum"
      - ".github/workflows/deploy-ingester.yml"
  workflow_dispatch: {}

# The ingester is a singleton guarded by a Postgres advisory lock. Two
# concurrent deploys would race to replace the machine holding it, so never
# cancel a run in flight — queue behind it.
concurrency:
  group: deploy-ingester
  cancel-in-progress: false

jobs:
  deploy:
    name: flyctl deploy (ingester)
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless Fly credentials exist
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_INGESTER }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN is not set - Fly is not provisioned yet. Skipping deploy."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.guard.outputs.enabled == 'true'
      - name: Deploy ingester to Fly
        if: steps.guard.outputs.enabled == 'true'
        run: >-
          flyctl deploy backend
          --config ingester/fly.toml
          --dockerfile ingester/Dockerfile
          --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_INGESTER }}
