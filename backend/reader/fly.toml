# Reader — public Go HTTP API with one warm machine and an autostopped spare.
# Deploy from the repo root with the backend/ build context:
#   flyctl deploy backend --config reader/fly.toml \
#     --dockerfile reader/Dockerfile --remote-only
# Secrets (DATABASE_URL) are set with `fly secrets set`, never here.

app = "scorearc-reader"
primary_region = "iad"   # MUST match the Neon region (see SETUP §4/§7)

[env]
  PORT = "8080"

# Schema gate: Fly runs this from the NEW image, with the app's secrets, before
# creating or updating any app machine; a non-zero exit aborts the deploy. It is
# the reader's own startup check (same login, same probe), printing one line.
# Only CMD is replaced: the image ENTRYPOINT ["/reader"] still runs, so the
# value is the flag alone -- "/reader -check-schema" would start the server.
# Never deploy with --skip-release-command (docs/backend/RELEASES.md).
[deploy]
  release_command = "-check-schema"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
