openapi: 3.1.0
info:
  title: ScoreArc Reader API
  version: "1.0.0"
  description: Public, read-only football data for ScoreArc consumers.
servers:
  - url: https://scorearc-reader.fly.dev
    description: Planned Fly.io reader origin; deployment assets are tracked separately.
paths:
  /healthz:
    get:
      operationId: health
      summary: Check process and database readiness
      responses:
        "200":
          description: Reader and database are healthy
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStoreCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database is unavailable
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStoreCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /v1/competitions/{comp}/{season}/matches:
    get:
      operationId: listMatches
      summary: List matches for a competition season
      description: >-
        Matches selected by kickoff, ordered by kickoff then id. Without range,
        the current Monday-Sunday UTC week, or with state=scheduled today
        through 28 days ahead (12 rows unless limit says otherwise). Each
        parameter may appear once; an unknown, duplicate, empty or malformed
        parameter is 400, never a fallback window. The freshness headers
        describe exactly the returned rows; poll health and unresolved-season
        dormancy checks always cover the whole season. scope=season is the
        complete monitoring scope.
      parameters:
        - { $ref: "#/components/parameters/Comp" }
        - { $ref: "#/components/parameters/Season" }
        - name: range
          in: query
          description: >-
            Inclusive UTC dates YYYYMMDD-YYYYMMDD: real dates, ordered, at most 92
            days between them (93 named days), years from 0100. Served as the
            half-open interval [start 00:00Z, day after end 00:00Z), clipped to
            the season's stored rows.
          schema: { type: string, pattern: "^[0-9]{8}-[0-9]{8}$" }
        - name: state
          in: query
          description: Only scheduled matches. Without range, the forward feed.
          schema: { type: string, enum: [scheduled] }
        - name: detail
          in: query
          description: >-
            Include each row's stored scorers, cards, stats, win probability and
            shootout detail (otherwise empty lists and nulls). An explicit range
            is then limited to 14 named days.
          schema: { type: string, enum: [summary] }
        - name: limit
          in: query
          description: At most this many rows, the earliest first. Digits only.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: scope
          in: query
          description: >-
            season: every stored row of the season with season-wide freshness,
            unenriched unless detail=summary is also given (the only parameter it
            combines with; the watchdog sends both). A season beyond 2,000 rows
            is 500, never a truncated list.
          schema: { type: string, enum: [season] }
      responses:
        "200":
          description: Matches ordered by kickoff, then id
          headers:
            X-ScoreArc-Freshness: { $ref: "#/components/headers/Freshness" }
            X-ScoreArc-Observed-At: { $ref: "#/components/headers/ObservedAt" }
            X-ScoreArc-Poll-Status: { $ref: "#/components/headers/PollStatus" }
            X-ScoreArc-Stale-Matches: { $ref: "#/components/headers/MatchCount" }
            X-ScoreArc-Overdue-Matches: { $ref: "#/components/headers/MatchCount" }
            Cache-Control: { $ref: "#/components/headers/LiveCacheControl" }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Match" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /v1/competitions/{comp}/{season}/calendar:
    get:
      operationId: getSeasonCalendar
      summary: Days of a season that hold matches, with per-state counts
      description: >-
        One entry per UTC date holding at least one stored match, in date order.
        Takes no query parameters. Freshness covers the whole season. A season
        beyond 2,000 match days is 500, never a truncated calendar.
      parameters:
        - { $ref: "#/components/parameters/Comp" }
        - { $ref: "#/components/parameters/Season" }
      responses:
        "200":
          description: Season calendar
          headers:
            X-ScoreArc-Freshness: { $ref: "#/components/headers/Freshness" }
            X-ScoreArc-Observed-At: { $ref: "#/components/headers/ObservedAt" }
            X-ScoreArc-Poll-Status: { $ref: "#/components/headers/PollStatus" }
            X-ScoreArc-Stale-Matches: { $ref: "#/components/headers/MatchCount" }
            X-ScoreArc-Overdue-Matches: { $ref: "#/components/headers/MatchCount" }
            Cache-Control: { $ref: "#/components/headers/LiveCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonCalendar" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /v1/competitions/{comp}/{season}/standings:
    get:
      operationId: listStandings
      summary: List standings grouped for display
      description: >-
        The stored provider tables only. Tables no provider publishes -- the MLS
        overall (Supporters' Shield) table and the Leagues Cup phase tables -- are
        derived by the consumer from this route and the phase window of the
        matches route (docs/backend/READER_CONTRACT.md, T10.10); Leagues Cup
        stores no table, so its list is empty.
      parameters:
        - { $ref: "#/components/parameters/Comp" }
        - { $ref: "#/components/parameters/Season" }
      responses:
        "200":
          description: Competition standings
          headers:
            Cache-Control: { $ref: "#/components/headers/StandardCacheControl" }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Group" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /v1/competitions/{comp}/{season}/bracket:
    get:
      operationId: getBracket
      summary: Get the reconstructed knockout bracket
      parameters:
        - { $ref: "#/components/parameters/Comp" }
        - { $ref: "#/components/parameters/Season" }
      responses:
        "200":
          description: Canonically ordered knockout rounds
          headers:
            X-ScoreArc-Freshness: { $ref: "#/components/headers/Freshness" }
            X-ScoreArc-Observed-At: { $ref: "#/components/headers/ObservedAt" }
            X-ScoreArc-Poll-Status: { $ref: "#/components/headers/PollStatus" }
            X-ScoreArc-Stale-Matches: { $ref: "#/components/headers/MatchCount" }
            X-ScoreArc-Overdue-Matches: { $ref: "#/components/headers/MatchCount" }
            Cache-Control: { $ref: "#/components/headers/LiveCacheControl" }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BracketRound" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /v1/competitions/{comp}/{season}/leaders:
    get:
      operationId: listLeaders
      summary: List goals or assists (default 10, maximum 30)
      parameters:
        - { $ref: "#/components/parameters/Comp" }
        - { $ref: "#/components/parameters/Season" }
        - in: query
          name: metric
          schema: { type: string, enum: [goals, assists], default: goals }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 30, default: 10 }
      description: >-
        Unknown, duplicate, empty or malformed parameters return a constant-message
        400. Rank is the stored ordinal, unique per board; equal values retain
        provider order. Values and identity are read in one bounded query.
      responses:
        "200":
          description: Players ordered by rank
          headers:
            Cache-Control: { $ref: "#/components/headers/StandardCacheControl" }
          content:
            application/json:
              schema: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/StatLeader" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /v1/competitions/{comp}/{season}/top-scorers:
    get:
      operationId: listTopScorers
      summary: List the goal-scoring leaderboard
      parameters:
        - { $ref: "#/components/parameters/Comp" }
        - { $ref: "#/components/parameters/Season" }
      responses:
        "200":
          description: Players ordered by rank
          headers:
            Cache-Control: { $ref: "#/components/headers/StandardCacheControl" }
          content:
            application/json:
              schema: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/TopScorer" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /v1/competitions/{comp}/{season}/teams/{teamId}:
    get:
      operationId: getTeam
      summary: Get one club's profile, squad and matches within a competition
      description: >-
        Takes no query parameters. A failed identity, snapshot or freshness
        read, or a cancelled or timed-out request, is a 500. A failed squad read is served as an empty squad, and a
        failed schedule read as an empty schedule with scheduleAvailability
        unavailable; either makes the response no-store.
      parameters:
        - { $ref: "#/components/parameters/Comp" }
        - { $ref: "#/components/parameters/Season" }
        - { $ref: "#/components/parameters/TeamID" }
      responses:
        "200":
          description: Club identity, season record, squad statistics and matches
          headers:
            X-ScoreArc-Freshness: { $ref: "#/components/headers/Freshness" }
            X-ScoreArc-Observed-At: { $ref: "#/components/headers/ObservedAt" }
            X-ScoreArc-Poll-Status: { $ref: "#/components/headers/PollStatus" }
            X-ScoreArc-Stale-Matches: { $ref: "#/components/headers/MatchCount" }
            X-ScoreArc-Overdue-Matches: { $ref: "#/components/headers/MatchCount" }
            Cache-Control: { $ref: "#/components/headers/TeamCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /v1/competitions/{comp}/{season}/teams/{teamId}/squad:
    get:
      operationId: getSquad
      summary: Get one club's squad within a competition, without its profile or matches
      description: >-
        Takes no query parameters. The same rows TeamProfile.squad embeds. As
        there, a failed squad read is served as an empty squad with
        Cache-Control no-store; a failed identity read or a cancelled or
        timed-out request is a 500.
      parameters:
        - { $ref: "#/components/parameters/Comp" }
        - { $ref: "#/components/parameters/Season" }
        - { $ref: "#/components/parameters/TeamID" }
      responses:
        "200":
          description: >-
            Squad players in provider roster order (rows written before
            migration 0027 fall back to shirt number, then name, until the next
            roster refresh), with season statistics
          headers:
            Cache-Control: { $ref: "#/components/headers/SquadCacheControl" }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SquadPlayer" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /v1/competitions/{comp}/{season}/players/{playerId}:
    get:
      operationId: getPlayer
      summary: Get a canonical player's identity, season totals, recent matches and career
      description: >-
        Requires a canonical lowercase hyphenated player UUID. Malformed ids,
        provider ids and all query parameters return 400; an unknown canonical
        UUID returns 404. Identity is returned even without optional scoped rows.
        Totals and the latest five played matches belong only to the requested
        competition and season. Totals use stored aggregates, never sums of
        incomplete appearances. Game-log evidence excludes unused or uncertain
        bench memberships and is ordered by kickoff descending, then match UUID
        descending. At most 2,000 candidate roster rows and 512 events per
        candidate are inspected; excess evidence fails closed. Career contains
        at most 50 rows in provider order with stable tie-breaks. The complete
        response is capped at 1 MiB; database query, evidence-bound and serialization
        failures return sanitized 500 with no-store. The existing ten-second
        request deadline and per-client rate limit apply. No provider requests.
      parameters:
        - { $ref: "#/components/parameters/Comp" }
        - { $ref: "#/components/parameters/Season" }
        - { $ref: "#/components/parameters/PlayerID" }
      responses:
        "200":
          description: Player identity with nullable metadata and bounded optional collections
          headers:
            Cache-Control: { $ref: "#/components/headers/StandardCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerProfile" }
        "400":
          description: Unknown competition or season, malformed player UUID, or any query parameter
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStoreCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Canonical player UUID not found
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStoreCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /v1/competitions/{comp}/news:
    get:
      operationId: listNews
      summary: List live ESPN news for a competition
      parameters:
        - { $ref: "#/components/parameters/Comp" }
      responses:
        "200":
          description: Recent news articles
          headers:
            Cache-Control: { $ref: "#/components/headers/StandardCacheControl" }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/NewsArticle" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /v1/matches/{id}/box-score:
    get:
      operationId: getBoxScore
      summary: Get the bounded roster and nullable player statistics for one match
      description: >-
        Canonical lowercase match UUID required; invalid aliases and unknown
        matches return 404. Query parameters are rejected. A known match without
        participation returns 200 with explicit availability, never inferred
        complete from empty arrays. At most 64 roster rows across both teams;
        excess evidence fails closed. No provider network requests.
      parameters:
        - $ref: "#/components/parameters/MatchID"
      responses:
        "200":
          description: Match box score
          headers:
            Cache-Control: { $ref: "#/components/headers/DetailCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoxScore" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /v1/matches/{id}:
    get:
      operationId: getMatchSummary
      summary: Get on-demand details for one match
      parameters:
        - $ref: "#/components/parameters/MatchID"
      responses:
        "200":
          description: Match summary
          headers:
            X-ScoreArc-Freshness: { $ref: "#/components/headers/Freshness" }
            X-ScoreArc-Observed-At: { $ref: "#/components/headers/ObservedAt" }
            X-ScoreArc-Poll-Status: { $ref: "#/components/headers/PollStatus" }
            X-ScoreArc-Stale-Matches: { $ref: "#/components/headers/MatchCount" }
            X-ScoreArc-Overdue-Matches: { $ref: "#/components/headers/MatchCount" }
            Cache-Control: { $ref: "#/components/headers/DetailCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
components:
  parameters:
    Comp:
      name: comp
      in: path
      required: true
      description: Whitelisted competition identifier, such as world-cup.
      schema: { type: string, minLength: 1 }
    Season:
      name: season
      in: path
      required: true
      description: Whitelisted season identifier within the competition.
      schema: { type: string, minLength: 1 }
    TeamID:
      name: teamId
      in: path
      required: true
      description: Our canonical team identifier, such as nat-mex. A provider id returns 404.
      schema: { type: string, minLength: 1 }
    PlayerID:
      name: playerId
      in: path
      required: true
      description: >-
        Canonical ScoreArc player UUID in lowercase hyphenated form. Aliases,
        provider ids and other UUID spellings return 400; an unknown UUID is 404.
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    MatchID:
      name: id
      in: path
      required: true
      description: >-
        Canonical ScoreArc match identifier — a UUID in its lowercase hyphenated
        form, opaque to consumers. Any other spelling (upper case, braces, urn:)
        and provider ids are 404; provider ids live in the match_external_ref
        crosswalk.
      schema: { type: string, minLength: 1 }
  headers:
    Freshness:
      required: true
      description: >-
        Core match freshness evaluated using reader time, not process health.
        Empty requires a recent full poll; dormant requires valid out-of-season
        bounds and no unfinalized rows in the competition season.
        Active collections require discovery polling even when all known rows
        are finalized; only an explicit finalized single-match selection can
        ignore poll expiry.
        Ordinary scheduled observations expire at 25 hours, allowing a 24-hour
        full-season reconciliation plus alignment/processing allowance.
        Explicit postponed/suspended observations and unfinalized finished
        observations expire at 24 hours; live observations at 2 minutes and
        competition polling at 20 minutes. Equality is stale.
        Body and metadata are read in one read-only repeatable-read snapshot.
        All five X-ScoreArc headers are exposed by CORS. Bookkeeping query or
        schema failure returns 500, never a healthy default.
      schema: { type: string, enum: [fresh, empty, dormant, stale, unavailable] }
    ObservedAt:
      description: >-
        Optional oldest known successful selected match observation or full
        competition poll timestamp. Never a retry or match update timestamp.
        Does not by itself imply health; inspect freshness and poll status.
      schema: { type: string, format: date-time }
    PollStatus:
      required: true
      description: Most recent ESPN competition-season poll outcome; unknown if none exists.
      schema: { type: string, enum: [ok, partial, failed, unknown] }
    MatchCount:
      required: true
      description: >-
        Number of selected matches that are stale (including missing observations
        or unhealthy active polling), or overdue by kickoff, respectively.
        Finalized rows never expire. Overdue is a subset of stale.
      schema: { type: integer, minimum: 0 }
    LiveCacheControl:
      description: public, max-age=10 when any result is live; otherwise public, max-age=60.
      schema: { type: string }
    StandardCacheControl:
      description: public, max-age=60.
      schema: { type: string }
    TeamCacheControl:
      description: public, max-age=120; no-store when a squad or schedule block is degraded.
      schema: { type: string }
    SquadCacheControl:
      description: public, max-age=300; no-store when the squad read failed.
      schema: { type: string }
    DetailCacheControl:
      description: public, max-age=30.
      schema: { type: string }
    NoStoreCacheControl:
      description: no-store.
      schema: { type: string, example: no-store }
  responses:
    BadRequest:
      description: Unknown competition or season, or an invalid query string
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStoreCacheControl" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Match or team not found
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStoreCacheControl" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MethodNotAllowed:
      description: HTTP method is not supported for this route
      headers:
        Allow:
          description: Supported method.
          schema: { type: string, example: GET }
        Cache-Control: { $ref: "#/components/headers/NoStoreCacheControl" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Per-client request budget exhausted
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStoreCacheControl" }
        Retry-After:
          description: Seconds before retrying.
          schema: { type: string, example: "1" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal database or serialization error
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStoreCacheControl" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: ESPN news request failed
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStoreCacheControl" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, unhealthy] }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
    Team:
      type: object
      additionalProperties: false
      required: [id, name, abbr, crestUrl]
      properties:
        id: { type: string }
        name: { type: string }
        abbr: { type: string }
        crestUrl: { type: [string, "null"] }
    PlayerSeasonStats:
      type: object
      additionalProperties: false
      required: [appearances, subIns, totalGoals, goalAssists, totalShots, shotsOnTarget, offsides, foulsCommitted, foulsSuffered, yellowCards, redCards, ownGoals, saves, shotsFaced, goalsConceded]
      properties:
        appearances: { type: [integer, "null"] }
        subIns: { type: [integer, "null"] }
        totalGoals: { type: [integer, "null"] }
        goalAssists: { type: [integer, "null"] }
        totalShots: { type: [integer, "null"] }
        shotsOnTarget: { type: [integer, "null"] }
        offsides: { type: [integer, "null"] }
        foulsCommitted: { type: [integer, "null"] }
        foulsSuffered: { type: [integer, "null"] }
        yellowCards: { type: [integer, "null"] }
        redCards: { type: [integer, "null"] }
        ownGoals: { type: [integer, "null"] }
        saves: { type: [integer, "null"] }
        shotsFaced: { type: [integer, "null"] }
        goalsConceded: { type: [integer, "null"] }
    SquadPlayer:
      type: object
      additionalProperties: false
      required: [id, name, jersey, position, age, nationality, headshotUrl, stats]
      properties:
        id:
          type: string
          description: >-
            The provider athlete id on the squad's source, as the frontend
            serves it (player slugs are keyed by it). Never the canonical
            player UUID.
        name: { type: string }
        jersey: { type: [integer, "null"] }
        position: { type: string }
        age:
          type: [integer, "null"]
          description: Whole years since the stored birth date, on the request's UTC date.
        nationality: { type: [string, "null"] }
        headshotUrl: { type: [string, "null"], description: "An https image URL on the providers CDN (espncdn.com); anything else is dropped at ingest." }
        stats:
          description: Null when the player has no season statistics at all, which is not the same as every stat being null.
          oneOf:
            - { $ref: "#/components/schemas/PlayerSeasonStats" }
            - { type: "null" }
    TeamRecord:
      type: object
      additionalProperties: false
      required: [summary, gamesPlayed, points, goalDifference]
      properties:
        summary: { type: string }
        gamesPlayed: { type: [integer, "null"] }
        points: { type: [integer, "null"] }
        goalDifference: { type: [integer, "null"] }
    TeamStanding:
      type: object
      additionalProperties: false
      required: [rank, competition]
      properties:
        rank: { type: integer, minimum: 1 }
        competition:
          type: string
          description: >-
            The label the rank is within: the team's table name (Group B,
            Apertura) when the season holds more than one stored table, else
            the competition's own name (Liga MX). An unnamed table among
            several has no label, so standing and standingSummary are null.
    ScheduleAvailability:
      type: object
      additionalProperties: false
      required: [results, upcoming]
      description: Whether the schedule could be read; not a claim of freshness or full coverage.
      properties:
        results: { type: string, enum: [available, unavailable] }
        upcoming: { type: string, enum: [available, unavailable] }
    MatchScope:
      type: object
      additionalProperties: false
      required: [competitionId, seasonId]
      properties:
        competitionId: { type: string }
        seasonId: { type: string }
    TeamProfile:
      type: object
      additionalProperties: false
      required: [team, location, color, altColor, record, standing, standingSummary, squad, schedule, scheduleAvailability]
      properties:
        team: { $ref: "#/components/schemas/Team" }
        location: { type: [string, "null"] }
        color: { type: [string, "null"] }
        altColor: { type: [string, "null"] }
        record:
          description: Derived from the team's first stored standing row (W-D-L, games, points, goal difference).
          oneOf:
            - { $ref: "#/components/schemas/TeamRecord" }
            - { type: "null" }
        standing:
          oneOf:
            - { $ref: "#/components/schemas/TeamStanding" }
            - { type: "null" }
        standingSummary:
          type: [string, "null"]
          description: >-
            The standing as an English sentence in the provider's shape, from
            the same rank and label: "1st in Liga MX", "2nd in Group B".
        squad: { type: array, items: { $ref: "#/components/schemas/SquadPlayer" } }
        schedule: { type: array, items: { $ref: "#/components/schemas/TeamMatch" } }
        scheduleAvailability: { $ref: "#/components/schemas/ScheduleAvailability" }
    PlayerProfile:
      type: object
      additionalProperties: false
      required: [id, playerSlug, name, age, position, jersey, nationality, flagUrl, headshotUrl, team, seasonLabel, totals, gameLogLabel, gameLog, career]
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        playerSlug:
          type: [string, "null"]
          enum: [null]
          description: Always null until an approved slug lookup exists; never guessed from a name or provider id.
        name: { type: string }
        age: { type: [integer, "null"], description: "Age derived from the stored birth date in UTC, or null when unknown." }
        position: { type: string }
        jersey: { type: [string, "null"], description: "Jersey from the latest scoped squad membership, or null." }
        nationality: { type: [string, "null"] }
        flagUrl: { type: [string, "null"], description: "Null because no player flag URL is held in the current schema." }
        headshotUrl: { type: [string, "null"], description: "Always null: player.headshot_url (migration 0027) is served on SquadPlayer, not yet here." }
        team:
          description: Canonical season-stat team, falling back to the latest scoped squad membership; null when absent.
          oneOf:
            - { $ref: "#/components/schemas/Team" }
            - { type: "null" }
        seasonLabel: { type: string }
        totals:
          type: array
          maxItems: 15
          description: Up to 15 named stored season measurements by default; empty without a scoped aggregate row. Unknown values remain null and measured zero remains zero.
          items: { $ref: "#/components/schemas/PlayerSeasonTotal" }
        gameLogLabel: { type: string, enum: ["Last 5 Matches"] }
        gameLog:
          type: array
          maxItems: 5
          description: Up to five played matches by default in the requested competition and season, newest kickoff first with descending match UUID tie-break; empty when no play is evidenced.
          items: { $ref: "#/components/schemas/GameLogRow" }
        career:
          type: array
          maxItems: 50
          description: Up to 50 career rows by default in stored provider order with stable tie-breaks; empty when absent.
          items: { $ref: "#/components/schemas/CareerStint" }
    PlayerSeasonTotal:
      type: object
      additionalProperties: false
      required: [name, label, display, value]
      properties:
        name: { type: string }
        label: { type: string }
        display: { type: string }
        value: { type: [integer, "null"] }
    GameLogRow:
      type: object
      additionalProperties: false
      required: [eventId, appearance, stats, date, atVs, opponent, score, result, homeTeamId, awayTeamId, teamId, teamAbbr]
      properties:
        eventId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: Canonical stored match UUID, not the frontend provider event id; consumers cut over with all match-id methods.
        appearance:
          type: string
          enum: [Started, Sub, ""]
          description: Started or Sub when entry status is known; empty when on-pitch events or a positive non-card measurement prove play without known entry status. Roster membership alone is insufficient.
        stats: { $ref: "#/components/schemas/LineupPlayerStats" }
        date: { type: [string, "null"], format: date-time }
        atVs: { type: string, enum: [vs, "@"] }
        opponent:
          oneOf:
            - { $ref: "#/components/schemas/Team" }
            - { type: "null" }
        score: { type: string, description: "Home-away regulation score, or empty when scores are unavailable; excludes shootout scores." }
        result: { type: string, enum: [W, L, D, ""], description: "Result from this match's player team perspective; empty when unavailable." }
        homeTeamId: { type: [string, "null"], description: Canonical home team id. }
        awayTeamId: { type: [string, "null"], description: Canonical away team id. }
        teamId: { type: [string, "null"], description: "Canonical team represented in this match, preserved across transfers." }
        teamAbbr: { type: string }
    CareerStint:
      type: object
      additionalProperties: false
      required: [teamId, teamName, crestUrl, seasons]
      properties:
        teamId: { type: [string, "null"], description: "Canonical team id resolved through the source-qualified crosswalk; null for unresolved teams." }
        teamName: { type: string, description: Stored team name retained even when identity is unresolved. }
        crestUrl: { type: [string, "null"], description: "Canonical team's crest, or null when the team is unresolved or the crest is absent." }
        seasons: { type: string }
    Scorer:
      type: object
      additionalProperties: false
      required: [teamId, player, minute, penalty, shootout, ownGoal, athleteId]
      properties:
        teamId:
          type: [string, "null"]
          description: Canonical id of the match side credited with the goal (for an own goal, the side that benefits), or null when the stored provider reference names neither side or both.
        player: { type: string }
        minute: { type: string }
        penalty: { type: boolean }
        shootout: { type: boolean }
        ownGoal:
          type: [boolean, "null"]
          description: Null when unknown, a match stored before own goals were captured whose scorers could not be aligned with its captured goal events.
        athleteId:
          type: [string, "null"]
          description: The source provider's athlete id, which the frontend match route resolves to a player slug; never a URL. Null when the provider names no athlete for the goal, or when unknown, a match stored before it was captured whose scorers could not be aligned with its captured goal events, or a recovered player without a single id on the match's source.
    Card:
      type: object
      additionalProperties: false
      required: [teamId, player, minute, type]
      properties:
        teamId:
          type: [string, "null"]
          description: Canonical id of the carded player's match side, or null when the stored provider reference names neither side or both.
        player: { type: string }
        minute: { type: string }
        type: { type: string, enum: [yellow, red] }
    WinProbability:
      type: object
      additionalProperties: false
      required: [home, draw, away]
      properties:
        home: { type: number }
        draw: { type: number }
        away: { type: number }
    CalendarDay:
      type: object
      additionalProperties: false
      required: [date, matches, scheduled, live, finished]
      properties:
        date: { type: string, format: date, description: UTC date. }
        matches: { type: integer, minimum: 1 }
        scheduled: { type: integer, minimum: 0 }
        live: { type: integer, minimum: 0 }
        finished: { type: integer, minimum: 0 }
    SeasonCalendar:
      type: object
      additionalProperties: false
      required: [firstKickoff, lastKickoff, days]
      properties:
        firstKickoff: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        lastKickoff: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        days: { type: array, items: { $ref: "#/components/schemas/CalendarDay" } }
    Shootout:
      type: object
      additionalProperties: false
      required: [homeScore, awayScore]
      properties:
        homeScore: { type: integer }
        awayScore: { type: integer }
    PenaltyKick:
      type: object
      additionalProperties: false
      required: [order, player, scored]
      properties:
        order: { type: integer }
        player: { type: string }
        scored: { type: boolean }
    ShootoutDetail:
      type: object
      additionalProperties: false
      required: [home, away]
      properties:
        home: { type: array, items: { $ref: "#/components/schemas/PenaltyKick" } }
        away: { type: array, items: { $ref: "#/components/schemas/PenaltyKick" } }
    TeamStats:
      type: object
      additionalProperties: false
      required: [possession, shots, shotsOnTarget, shotAccuracy, corners, offsides, passes, passesAccurate, passAccuracy, crosses, crossesAccurate, crossAccuracy, longBalls, tackles, tacklesEffective, tackleAccuracy, interceptions, clearances, blockedShots, saves, fouls, yellowCards, redCards]
      description: >-
        Percentages use 0-100, rounded to one decimal. Valid nonnegative operands
        with a positive denominator and numerator no greater than denominator
        take precedence. Missing operands may use a valid stored provider percent;
        invalid or zero denominators yield null. Unknown operands stay null.
      properties:
        possession: { type: [number, "null"] }
        shots: { type: [number, "null"] }
        shotsOnTarget: { type: [number, "null"] }
        shotAccuracy: { type: [number, "null"] }
        corners: { type: [number, "null"] }
        offsides: { type: [number, "null"] }
        passes: { type: [number, "null"] }
        passesAccurate: { type: [number, "null"] }
        passAccuracy: { type: [number, "null"] }
        crosses: { type: [number, "null"] }
        crossesAccurate: { type: [number, "null"] }
        crossAccuracy: { type: [number, "null"] }
        longBalls: { type: [number, "null"] }
        tackles: { type: [number, "null"] }
        tacklesEffective: { type: [number, "null"] }
        tackleAccuracy: { type: [number, "null"] }
        interceptions: { type: [number, "null"] }
        clearances: { type: [number, "null"] }
        blockedShots: { type: [number, "null"] }
        saves: { type: [number, "null"] }
        fouls: { type: [number, "null"] }
        yellowCards: { type: [number, "null"] }
        redCards: { type: [number, "null"] }
    MatchStats:
      type: object
      additionalProperties: false
      required: [home, away]
      properties:
        home: { $ref: "#/components/schemas/TeamStats" }
        away: { $ref: "#/components/schemas/TeamStats" }
    # TeamMatch repeats every property below plus scope (additionalProperties:
    # false rules out allOf); edit both. reader_contract_test.go fails on drift.
    Match:
      type: object
      additionalProperties: false
      required: [id, kickoff, state, minute, statusDetail, statusName, home, away, homeScore, awayScore, winnerId, note, scorers, cards, shootout, shootoutDetail, stats, winProbability]
      properties:
        id: { type: string }
        kickoff: { type: string, format: date-time }
        state: { type: string, enum: [scheduled, live, finished] }
        minute: { type: [string, "null"] }
        statusDetail: { type: string }
        statusName: { type: string }
        home: { $ref: "#/components/schemas/Team" }
        away: { $ref: "#/components/schemas/Team" }
        homeScore: { type: [integer, "null"] }
        awayScore: { type: [integer, "null"] }
        winnerId: { type: [string, "null"] }
        note: { type: [string, "null"] }
        scorers: { type: array, items: { $ref: "#/components/schemas/Scorer" } }
        cards: { type: array, items: { $ref: "#/components/schemas/Card" } }
        shootout: { oneOf: [{ $ref: "#/components/schemas/Shootout" }, { type: "null" }] }
        shootoutDetail: { oneOf: [{ $ref: "#/components/schemas/ShootoutDetail" }, { type: "null" }] }
        stats: { oneOf: [{ $ref: "#/components/schemas/MatchStats" }, { type: "null" }] }
        winProbability: { oneOf: [{ $ref: "#/components/schemas/WinProbability" }, { type: "null" }] }
    # Match plus scope; keep in step with Match above.
    TeamMatch:
      description: A Match on a team schedule, with the competition season it belongs to.
      type: object
      additionalProperties: false
      required: [scope, id, kickoff, state, minute, statusDetail, statusName, home, away, homeScore, awayScore, winnerId, note, scorers, cards, shootout, shootoutDetail, stats, winProbability]
      properties:
        id: { type: string }
        kickoff: { type: string, format: date-time }
        state: { type: string, enum: [scheduled, live, finished] }
        minute: { type: [string, "null"] }
        statusDetail: { type: string }
        statusName: { type: string }
        home: { $ref: "#/components/schemas/Team" }
        away: { $ref: "#/components/schemas/Team" }
        homeScore: { type: [integer, "null"] }
        awayScore: { type: [integer, "null"] }
        winnerId: { type: [string, "null"] }
        note: { type: [string, "null"] }
        scorers: { type: array, items: { $ref: "#/components/schemas/Scorer" } }
        cards: { type: array, items: { $ref: "#/components/schemas/Card" } }
        shootout: { oneOf: [{ $ref: "#/components/schemas/Shootout" }, { type: "null" }] }
        shootoutDetail: { oneOf: [{ $ref: "#/components/schemas/ShootoutDetail" }, { type: "null" }] }
        stats: { oneOf: [{ $ref: "#/components/schemas/MatchStats" }, { type: "null" }] }
        winProbability: { oneOf: [{ $ref: "#/components/schemas/WinProbability" }, { type: "null" }] }
        scope: { $ref: "#/components/schemas/MatchScope" }
    Standing:
      type: object
      additionalProperties: false
      required: [team, rank, played, wins, draws, losses, goalsFor, goalsAgainst, goalDifference, points, advanced]
      properties:
        team: { $ref: "#/components/schemas/Team" }
        rank: { type: integer }
        played: { type: integer }
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }
        goalsFor: { type: integer }
        goalsAgainst: { type: integer }
        goalDifference: { type: integer }
        points: { type: integer }
        advanced: { type: boolean }
    Group:
      type: object
      additionalProperties: false
      required: [id, name, standings]
      properties:
        id: { type: string }
        name: { type: string }
        standings: { type: array, items: { $ref: "#/components/schemas/Standing" } }
    BracketTeam:
      type: object
      additionalProperties: false
      required: [id, name, abbr, crestUrl, placeholder]
      properties:
        id: { type: string }
        name: { type: string }
        abbr: { type: string }
        crestUrl: { type: [string, "null"] }
        placeholder: { type: boolean }
    BracketMatch:
      type: object
      additionalProperties: false
      required: [id, round, kickoff, home, away, homeScore, awayScore, state, statusDetail, statusName, minute, winnerId, note]
      properties:
        id: { type: string }
        round: { $ref: "#/components/schemas/KnockoutRound" }
        kickoff: { type: string, format: date-time }
        home: { $ref: "#/components/schemas/BracketTeam" }
        away: { $ref: "#/components/schemas/BracketTeam" }
        homeScore: { type: [integer, "null"] }
        awayScore: { type: [integer, "null"] }
        state: { type: string, enum: [scheduled, live, finished] }
        statusDetail: { type: string }
        statusName: { type: string }
        minute: { type: [string, "null"] }
        winnerId: { type: [string, "null"] }
        note: { type: [string, "null"] }
    BracketRound:
      type: object
      additionalProperties: false
      required: [slug, name, matches]
      properties:
        slug: { $ref: "#/components/schemas/KnockoutRound" }
        name:
          type: string
          description: English display label for API consumers. Clients that localize derive their label from slug.
        matches: { type: array, items: { $ref: "#/components/schemas/BracketMatch" } }
    KnockoutRound:
      type: string
      description: Knockout round slug. Historical aliases (second-round, third-place) are normalized before storage.
      enum: [round-of-32, round-of-16, quarterfinals, semifinals, final, 3rd-place-match]
    StatLeader:
      type: object
      additionalProperties: false
      required: [rank, player, athleteId, playerId, playerSlug, teamId, teamAbbr, teamName, teamCrestUrl, value, matches]
      properties:
        rank: { type: integer }
        player: { type: string }
        athleteId: { type: [string, "null"], description: "ESPN athlete reference; never a public URL key." }
        playerId: { type: [string, "null"], format: uuid }
        teamId: { type: [string, "null"], description: "Canonical team id from the source-qualified crosswalk." }
        playerSlug: { type: [string, "null"], description: "Unavailable; render plain text, never invent a link." }
        teamAbbr: { type: string }
        teamName: { type: string }
        teamCrestUrl: { type: [string, "null"] }
        value: { type: integer }
        matches: { type: [integer, "null"] }
    TopScorer:
      type: object
      additionalProperties: false
      required: [rank, player, teamAbbr, teamName, teamCrestUrl, goals, matches]
      properties:
        rank: { type: integer }
        player: { type: string }
        teamAbbr: { type: string }
        teamName: { type: string }
        teamCrestUrl: { type: [string, "null"] }
        goals: { type: integer }
        matches: { type: [integer, "null"] }
    NewsArticle:
      type: object
      additionalProperties: false
      required: [id, headline, description, published, image, url, byline]
      properties:
        id: { type: string }
        headline: { type: string }
        description: { type: string }
        published: { type: string, description: "ISO timestamp when ESPN supplies one; otherwise empty." }
        image: { type: [string, "null"] }
        url: { type: string }
        byline: { type: string }
    LineupPlayerStats:
      type: object
      additionalProperties: false
      required: [appearances, subIns, totalGoals, goalAssists, totalShots, shotsOnTarget, offsides, foulsCommitted, foulsSuffered, yellowCards, redCards, ownGoals, saves, goalsConceded, shotsFaced]
      description: Nullable measurements; roster membership alone does not prove an appearance.
      properties:
        appearances: { type: [integer, "null"] }
        subIns: { type: [integer, "null"] }
        totalGoals: { type: [integer, "null"] }
        goalAssists: { type: [integer, "null"] }
        totalShots: { type: [integer, "null"] }
        shotsOnTarget: { type: [integer, "null"] }
        offsides: { type: [integer, "null"] }
        foulsCommitted: { type: [integer, "null"] }
        foulsSuffered: { type: [integer, "null"] }
        yellowCards: { type: [integer, "null"] }
        redCards: { type: [integer, "null"] }
        ownGoals: { type: [integer, "null"] }
        saves: { type: [integer, "null"] }
        goalsConceded: { type: [integer, "null"] }
        shotsFaced: { type: [integer, "null"] }
    LineupPlayer:
      type: object
      additionalProperties: false
      required: [name, number, position, jersey, starter, stats, athleteId, playerId, playerSlug]
      properties:
        name: { type: string }
        number: { type: [integer, "null"] }
        position: { type: string }
        jersey: { type: [string, "null"] }
        starter: { type: [boolean, "null"] }
        stats: { oneOf: [{ $ref: "#/components/schemas/LineupPlayerStats" }, { type: "null" }] }
        athleteId: { type: [string, "null"], description: "ESPN reference; never a public URL key." }
        playerId: { type: [string, "null"], format: uuid }
        playerSlug: { type: [string, "null"], description: "Unavailable; display an unlinked name." }
    TeamLineup:
      type: object
      additionalProperties: false
      required: [teamId, formation, players]
      properties:
        teamId: { type: [string, "null"] }
        formation: { type: string }
        players: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/LineupPlayer" } }
    ParticipationAvailability:
      type: string
      enum: [complete, pending, partial, unavailable]
      description: >-
        complete requires the completion ledger's public projection; pending
        means enrolled but incomplete (including failed attempts); partial means
        held rows without completion evidence; unavailable means no held rows or
        enrollment. Completion does not imply all optional statistics are known.
    MatchLineups:
      type: object
      additionalProperties: false
      required: [availability, home, away]
      properties:
        availability: { $ref: "#/components/schemas/ParticipationAvailability" }
        home: { $ref: "#/components/schemas/TeamLineup" }
        away: { $ref: "#/components/schemas/TeamLineup" }
    TeamBoxScore:
      type: object
      additionalProperties: false
      required: [teamId, players]
      properties:
        teamId: { type: string }
        players: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/LineupPlayer" } }
    BoxScore:
      type: object
      additionalProperties: false
      required: [matchId, availability, home, away]
      properties:
        matchId: { type: string, format: uuid }
        availability: { $ref: "#/components/schemas/ParticipationAvailability" }
        home: { $ref: "#/components/schemas/TeamBoxScore" }
        away: { $ref: "#/components/schemas/TeamBoxScore" }
    MatchVideo:
      type: object
      additionalProperties: false
      required: [id, headline, duration, thumbnail, mp4Url, isGoal]
      properties:
        id: { type: string }
        headline: { type: string }
        duration: { type: [integer, "null"] }
        thumbnail: { type: [string, "null"] }
        mp4Url: { type: [string, "null"] }
        isGoal: { type: boolean }
    MatchInfo:
      type: object
      additionalProperties: false
      required: [venue, city, referee, attendance]
      properties:
        venue: { type: [string, "null"] }
        city: { type: [string, "null"] }
        referee: { type: [string, "null"] }
        attendance: { type: [integer, "null"] }
    FormResult:
      type: object
      additionalProperties: false
      required: [result, opponent, score]
      properties:
        result: { type: string, enum: [W, L, D] }
        opponent: { type: string }
        score: { type: string }
    MatchForm:
      type: object
      additionalProperties: false
      required: [home, away]
      properties:
        home: { type: array, items: { $ref: "#/components/schemas/FormResult" } }
        away: { type: array, items: { $ref: "#/components/schemas/FormResult" } }
    CommentaryItem:
      type: object
      additionalProperties: false
      required: [minute, text]
      properties:
        minute: { type: string }
        text: { type: string }
    H2HMeeting:
      type: object
      additionalProperties: false
      required: [date, label]
      properties:
        date: { type: string, description: "ISO timestamp when ESPN supplies one; otherwise empty." }
        label: { type: string }
    MatchSummary:
      type: object
      additionalProperties: false
      required: [scorers, cards, stats, winProbability, lineups, videos, shootoutDetail, info, form, commentary, h2h]
      properties:
        scorers: { type: array, items: { $ref: "#/components/schemas/Scorer" } }
        cards: { type: array, items: { $ref: "#/components/schemas/Card" } }
        stats: { oneOf: [{ $ref: "#/components/schemas/MatchStats" }, { type: "null" }] }
        winProbability: { oneOf: [{ $ref: "#/components/schemas/WinProbability" }, { type: "null" }] }
        lineups: { oneOf: [{ $ref: "#/components/schemas/MatchLineups" }, { type: "null" }] }
        videos: { type: array, items: { $ref: "#/components/schemas/MatchVideo" } }
        shootoutDetail: { oneOf: [{ $ref: "#/components/schemas/ShootoutDetail" }, { type: "null" }] }
        info: { oneOf: [{ $ref: "#/components/schemas/MatchInfo" }, { type: "null" }] }
        form: { oneOf: [{ $ref: "#/components/schemas/MatchForm" }, { type: "null" }] }
        commentary: { type: array, items: { $ref: "#/components/schemas/CommentaryItem" } }
        h2h: { type: array, items: { $ref: "#/components/schemas/H2HMeeting" } }
